name: Quality checks

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  syntax:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          coverage: none

      - name: Check PHP and template syntax
        shell: bash
        run: |
          set -euo pipefail
          while IFS= read -r -d '' file; do
            php -l "$file"
          done < <(find . -type f \( -name '*.php' -o -name '*.phtml' \) -print0)

      - name: Check JavaScript syntax
        shell: bash
        run: |
          set -euo pipefail
          while IFS= read -r -d '' file; do
            node --check "$file"
          done < <(find resources -type f -name '*.js' -print0)

      - name: Check release metadata and package structure
        shell: bash
        run: |
          set -euo pipefail
          test -f module.php
          test -f PottsMemberHelp.php
          test -f src/HelpRepository.php
          test -f TRANSLATING.md
          declared_version="$(sed -n "s/.*private const VERSION = '\([^']*\)'.*/\1/p" PottsMemberHelp.php)"
          latest_version="$(tr -d '\r\n' < latest-version.txt)"
          test -n "$declared_version"
          test "$declared_version" = "$latest_version"
          test "$(find resources/screenshots -maxdepth 1 -type f -name '*.webp' | wc -l)" -eq 12
